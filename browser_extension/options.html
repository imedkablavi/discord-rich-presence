<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYBREX Rich Presence Companion</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      max-width: 620px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 8px 0 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      box-sizing: border-box;
      width: 180px;
      padding: 8px 10px;
      font: inherit;
    }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    button { padding: 8px 14px; font: inherit; cursor: pointer; }
    #status { min-height: 1.5em; margin-top: 14px; }
    .note { opacity: 0.75; font-size: 13px; }
  </style>
</head>
<body>
  <h1>CYBREX Rich Presence Companion</h1>
  <p>Set the loopback port used by the desktop service. The default is <strong>32191</strong>.</p>

  <label for="port">Desktop bridge port</label>
  <input id="port" type="number" min="1024" max="65535" step="1" inputmode="numeric">

  <div class="actions">
    <button id="save" type="button">Save</button>
    <button id="test" type="button">Test connection</button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <p class="note">If you change this value, set the same <code>browser_companion.port</code> in the desktop configuration.</p>

  <script src="options.js"></script>
</body>
</html>
