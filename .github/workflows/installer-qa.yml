name: Installer QA

on:
  pull_request:
    paths:
      - "packaging/**"
      - "discord-rich-presence.spec"
      - "launcher.py"
      - "updater.py"
      - "update_manager.py"
      - "config_hardening.py"
      - "memory_guard.py"
      - "resource_hardening.py"
      - "dynamic_identity.py"
      - "social_sdk_transport.py"
      - "social_sdk_protocol.py"
      - "native/discord_social_sdk_bridge/**"
      - "scripts/build_social_sdk_bridge.py"
      - "detectors/media.py"
      - "gui_modern_v3.py"
      - "gui_modern_v4.py"
      - "requirements*.txt"
      - ".github/workflows/installer-qa.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "discord-rich-presence.spec"
      - "launcher.py"
      - "updater.py"
      - "update_manager.py"
      - "config_hardening.py"
      - "memory_guard.py"
      - "resource_hardening.py"
      - "dynamic_identity.py"
      - "social_sdk_transport.py"
      - "social_sdk_protocol.py"
      - "native/discord_social_sdk_bridge/**"
      - "scripts/build_social_sdk_bridge.py"
      - "detectors/media.py"
      - "gui_modern_v3.py"
      - "gui_modern_v4.py"
      - "requirements*.txt"
      - ".github/workflows/installer-qa.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency environment
        run: python -m pip check
      - name: Build packaged application
        run: pyinstaller --clean --noconfirm discord-rich-presence.spec
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist/DiscordRichPresence.exe" `
            -ArgumentList "--dry-run", "--once" `
            -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill()
            throw "Packaged executable did not exit after a one-cycle dry run"
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable exited with code $($process.ExitCode)"
          }
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc "/DAppVersion=0.0.0-dev" "packaging/windows/CYBREX-Presence.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "dist/CYBREX-Presence-Setup.exe")) {
            throw "Windows installer was not created"
          }
          if ((Get-Item "dist/CYBREX-Presence-Setup.exe").Length -lt 1000000) {
            throw "Windows installer is unexpectedly small"
          }
      - name: Silent-install and smoke-test installer
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "CYBREX-Presence-QA"
          $installer = Resolve-Path "dist/CYBREX-Presence-Setup.exe"
          $setup = Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$target" `
            -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "Installer exited with code $($setup.ExitCode)"
          }
          $installed = Join-Path $target "DiscordRichPresence.exe"
          if (-not (Test-Path $installed)) {
            throw "Installed application executable was not found"
          }
          $process = Start-Process `
            -FilePath $installed `
            -ArgumentList "--dry-run", "--once" `
            -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill()
            throw "Installed executable did not exit after a one-cycle dry run"
          }
          if ($process.ExitCode -ne 0) {
            throw "Installed executable exited with code $($process.ExitCode)"
          }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller was not created"
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CYBREX-Presence-Windows-Installer
          path: dist/CYBREX-Presence-Setup.exe
          if-no-files-found: error

  linux-user-installer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency environment
        run: python -m pip check
      - name: Build packaged application
        run: pyinstaller --clean --noconfirm discord-rich-presence.spec
      - name: Build user-level installer bundle
        run: |
          set -euo pipefail
          mkdir -p dist/CYBREX-Presence-linux-x86_64
          cp dist/DiscordRichPresence dist/CYBREX-Presence-linux-x86_64/CYBREX-DiscordRichPresence-linux-x86_64
          cp packaging/linux/install-user.sh dist/CYBREX-Presence-linux-x86_64/install-user.sh
          chmod 755 dist/CYBREX-Presence-linux-x86_64/CYBREX-DiscordRichPresence-linux-x86_64
          chmod 755 dist/CYBREX-Presence-linux-x86_64/install-user.sh
          (
            cd dist/CYBREX-Presence-linux-x86_64
            sha256sum CYBREX-DiscordRichPresence-linux-x86_64 > SHA256SUMS
          )
      - name: Verify tampered Linux bundle fails closed
        run: |
          set -euo pipefail
          tampered="$RUNNER_TEMP/tampered-bundle"
          cp -a dist/CYBREX-Presence-linux-x86_64 "$tampered"
          printf 'tamper' >> "$tampered/CYBREX-DiscordRichPresence-linux-x86_64"
          export HOME="$RUNNER_TEMP/tampered-home"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME"
          if bash "$tampered/install-user.sh"; then
            echo "Tampered release bundle was accepted" >&2
            exit 1
          fi
          test ! -e "$HOME/.local/lib/cybrex-presence/DiscordRichPresence"
      - name: Install, smoke-test, and uninstall as an unprivileged user
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cybrex-home"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME"
          bash dist/CYBREX-Presence-linux-x86_64/install-user.sh
          target="$HOME/.local/lib/cybrex-presence/DiscordRichPresence"
          link="$HOME/.local/bin/cybrex-presence"
          desktop="$XDG_DATA_HOME/applications/cybrex-presence.desktop"
          test -x "$target"
          test -L "$link"
          test "$(readlink -f "$link")" = "$target"
          test -w "$target"
          test -f "$desktop"
          grep -Fq "Exec=$target --gui" "$desktop"
          timeout 20s "$target" --dry-run --once
          bash dist/CYBREX-Presence-linux-x86_64/install-user.sh --uninstall
          test ! -e "$target"
          test ! -e "$link"
          test ! -e "$desktop"
      - name: Archive user-level installer bundle
        run: |
          set -euo pipefail
          tar -C dist -czf dist/CYBREX-Presence-linux-x86_64.tar.gz CYBREX-Presence-linux-x86_64
          (
            cd dist
            sha256sum CYBREX-Presence-linux-x86_64.tar.gz > CYBREX-Presence-linux-x86_64.tar.gz.sha256
          )
          grep -Eq '^[0-9a-f]{64}  CYBREX-Presence-linux-x86_64\.tar\.gz$' dist/CYBREX-Presence-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CYBREX-Presence-Linux-User-Installer
          path: |
            dist/CYBREX-Presence-linux-x86_64.tar.gz
            dist/CYBREX-Presence-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
