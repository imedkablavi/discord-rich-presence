name: Release Candidate v2.1.0-rc3

on:
  push:
    branches:
      - release/v2.1.0-rc3
    paths:
      - .github/workflows/release-candidate-v2.1.0-rc3.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: 2.1.0-rc3
  RELEASE_TAG: v2.1.0-rc3

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt "pip-audit>=2.9,<3" "bandit>=1.8,<2"
      - name: Verify dependency environment
        run: python -m pip check
      - name: Stamp and verify RC version
        run: |
          python scripts/write-version.py "$RELEASE_TAG"
          python -c "from app_version import APP_VERSION; assert APP_VERSION == '$RELEASE_VERSION', APP_VERSION"
      - name: Compile sources
        run: python -m compileall -q .
      - name: Run critical Ruff checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Run test suite
        run: pytest -q
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: High-severity Bandit gate
        run: bandit -q -r . -x ./tests,./build,./dist -lll

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Stamp RC version
        shell: pwsh
        run: |
          python scripts/write-version.py $env:RELEASE_TAG
          python -c "from app_version import APP_VERSION; assert APP_VERSION == '$env:RELEASE_VERSION', APP_VERSION"
      - name: Import desktop entry points
        run: python -c "import app_version, customtkinter, gui_modern, launcher, tray_icon, updater"
      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm discord-rich-presence.spec
      - name: Smoke-test executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DiscordRichPresence.exe")) { throw "Windows executable was not created" }
          if ((Get-Item "dist/DiscordRichPresence.exe").Length -lt 1000000) { throw "Windows executable is unexpectedly small" }
          $p = Start-Process -FilePath "dist/DiscordRichPresence.exe" -ArgumentList "--dry-run", "--once" -PassThru
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "Windows executable smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Windows executable exited with code $($p.ExitCode)" }
      - name: Detect Windows signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Authenticode-sign Windows executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) { throw "Windows signing password is missing" }
          $cert = Join-Path $env:RUNNER_TEMP "cybrex-rc3-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signtool) { throw "signtool.exe was not found" }
            & $signtool.FullName sign /fd SHA256 /f $cert /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "dist/DiscordRichPresence.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
            if ((Get-AuthenticodeSignature "dist/DiscordRichPresence.exe").Status -ne 'Valid') { throw "Executable signature verification failed" }
          } finally {
            Remove-Item $cert -Force -ErrorAction SilentlyContinue
          }
      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "packaging/windows/CYBREX-Presence.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/CYBREX-Presence-Setup.exe")) { throw "Windows installer was not created" }
          Move-Item "dist/CYBREX-Presence-Setup.exe" "dist/CYBREX-Presence-Setup-$env:RELEASE_VERSION-windows-x86_64.exe"
      - name: Authenticode-sign Windows installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "cybrex-rc3-installer-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signtool) { throw "signtool.exe was not found" }
            $installer = "dist/CYBREX-Presence-Setup-$env:RELEASE_VERSION-windows-x86_64.exe"
            & $signtool.FullName sign /fd SHA256 /f $cert /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw "installer signtool failed with exit code $LASTEXITCODE" }
            if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw "Installer signature verification failed" }
          } finally {
            Remove-Item $cert -Force -ErrorAction SilentlyContinue
          }
      - name: Silent install / launch / uninstall QA
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "CYBREX-Presence-RC3-QA"
          $installer = Resolve-Path "dist/CYBREX-Presence-Setup-$env:RELEASE_VERSION-windows-x86_64.exe"
          $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$target" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          $installed = Join-Path $target "DiscordRichPresence.exe"
          if (-not (Test-Path $installed)) { throw "Installed executable not found" }
          $p = Start-Process -FilePath $installed -ArgumentList "--dry-run", "--once" -PassThru
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "Installed executable smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Installed executable exited with code $($p.ExitCode)" }
          $uninstaller = Join-Path $target "unins000.exe"
          $u = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exited with code $($u.ExitCode)" }
      - name: Build Windows portable bundle
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "CYBREX-Presence-$env:RELEASE_VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/DiscordRichPresence.exe" $stage
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE" $stage
          Copy-Item "config.example.yaml" $stage
          Copy-Item "docs/PRIVACY.md" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/CYBREX-Presence-$env:RELEASE_VERSION-windows-x86_64-portable.zip" -Force
      - name: Package Browser Companion
        shell: pwsh
        run: |
          python -m json.tool browser_extension/manifest.json | Out-Null
          node --check browser_extension/background.js
          node --check browser_extension/content.js
          node --check browser_extension/options.js
          $stage = Join-Path $env:RUNNER_TEMP "CYBREX-Browser-Companion-$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($file in @("manifest.json", "background.js", "content.js", "options.html", "options.js", "README.md")) { Copy-Item "browser_extension/$file" $stage }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/CYBREX-Browser-Companion-$env:RELEASE_VERSION.zip" -Force
      - name: Stage Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "dist/CYBREX-Presence-Setup-$env:RELEASE_VERSION-windows-x86_64.exe" release-assets/
          Copy-Item "dist/CYBREX-Presence-$env:RELEASE_VERSION-windows-x86_64-portable.zip" release-assets/
          Copy-Item "dist/CYBREX-Browser-Companion-$env:RELEASE_VERSION.zip" release-assets/
          Copy-Item "dist/DiscordRichPresence.exe" release-assets/DiscordRichPresence.exe
      - uses: actions/upload-artifact@v7
        with:
          name: rc3-windows
          path: release-assets/*
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Stamp RC version
        run: |
          python scripts/write-version.py "$RELEASE_TAG"
          python -c "from app_version import APP_VERSION; assert APP_VERSION == '$RELEASE_VERSION', APP_VERSION"
      - name: Import desktop entry points
        run: python -c "import app_version, customtkinter, gui_modern, launcher, tray_icon, updater"
      - name: Build Linux executable
        run: pyinstaller --clean --noconfirm discord-rich-presence.spec
      - name: Smoke-test Linux executable
        run: |
          test -x dist/DiscordRichPresence
          test "$(stat -c %s dist/DiscordRichPresence)" -gt 1000000
          timeout 20s ./dist/DiscordRichPresence --dry-run --once
      - name: Build Linux user bundle
        run: |
          set -euo pipefail
          raw="CYBREX-DiscordRichPresence-linux-x86_64"
          cp dist/DiscordRichPresence "dist/$raw"
          chmod 755 "dist/$raw"
          stage="dist/CYBREX-Presence-$RELEASE_VERSION-linux-x86_64"
          mkdir -p "$stage"
          cp "dist/$raw" "$stage/$raw"
          cp packaging/linux/install-user.sh "$stage/install-user.sh"
          chmod 755 "$stage/install-user.sh"
          (cd "$stage" && sha256sum "$raw" > SHA256SUMS)
          tar -C dist -czf "dist/CYBREX-Presence-$RELEASE_VERSION-linux-x86_64.tar.gz" "CYBREX-Presence-$RELEASE_VERSION-linux-x86_64"
      - name: Verify Linux installer bundle
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cybrex-rc3-home"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME"
          bash "dist/CYBREX-Presence-$RELEASE_VERSION-linux-x86_64/install-user.sh"
          target="$HOME/.local/lib/cybrex-presence/DiscordRichPresence"
          test -x "$target"
          timeout 20s "$target" --dry-run --once
          bash "dist/CYBREX-Presence-$RELEASE_VERSION-linux-x86_64/install-user.sh" --uninstall
          test ! -e "$target"
      - name: Stage Linux release assets
        run: |
          mkdir -p release-assets
          cp "dist/CYBREX-DiscordRichPresence-linux-x86_64" release-assets/
          cp "dist/CYBREX-Presence-$RELEASE_VERSION-linux-x86_64.tar.gz" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: rc3-linux
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [validate, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: rc3-windows
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: rc3-linux
          path: release-assets
      - name: Generate combined checksums and provenance
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            "CYBREX-Presence-Setup-$RELEASE_VERSION-windows-x86_64.exe" \
            "CYBREX-Presence-$RELEASE_VERSION-windows-x86_64-portable.zip" \
            "CYBREX-Browser-Companion-$RELEASE_VERSION.zip" \
            DiscordRichPresence.exe \
            CYBREX-DiscordRichPresence-linux-x86_64 \
            "CYBREX-Presence-$RELEASE_VERSION-linux-x86_64.tar.gz" \
            > SHA256SUMS.txt
          {
            echo "CYBREX Presence $RELEASE_TAG"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Source branch: $GITHUB_REF_NAME"
          } > BUILD-PROVENANCE.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/v2.1.0-rc3.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --title "CYBREX Presence $RELEASE_TAG" --notes-file "$notes"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "CYBREX Presence $RELEASE_TAG" \
              --notes-file "$notes"
          fi
