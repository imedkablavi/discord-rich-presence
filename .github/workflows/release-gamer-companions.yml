name: Release Gamer Companions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: gamer-companions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          verify-signature: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.1"
      - name: Build Minecraft Fabric companion
        working-directory: integrations/minecraft/fabric-26.2
        run: gradle --no-daemon build
      - name: Package gamer companions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          minecraft_jar="$(find integrations/minecraft/fabric-26.2/build/libs \
            -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$minecraft_jar"
          test "$(stat -c %s "$minecraft_jar")" -gt 1000
          jar tf "$minecraft_jar" | grep -q '^fabric.mod.json$'
          jar tf "$minecraft_jar" | grep -q '^com/cybrex/presence/CybrexPresenceClient.class$'
          cp "$minecraft_jar" release-assets/CYBREX-Minecraft-Companion-26.2.jar

          (
            cd integrations/fivem
            zip -r "${GITHUB_WORKSPACE}/release-assets/CYBREX-FiveM-Companion.zip" \
              cybrex_presence \
              -x '*/__pycache__/*' '*.pyc' '*.DS_Store'
          )

          cd release-assets
          sha256sum CYBREX-Minecraft-Companion-26.2.jar > CYBREX-Minecraft-Companion-26.2.jar.sha256
          sha256sum CYBREX-FiveM-Companion.zip > CYBREX-FiveM-Companion.zip.sha256
          sha256sum -c CYBREX-Minecraft-Companion-26.2.jar.sha256
          sha256sum -c CYBREX-FiveM-Companion.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gamer-release-companions
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gamer-release-companions
          path: release-assets
      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == refs/tags/* ]]
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
      - name: Wait for matching desktop release and upload companions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          found=false
          for _ in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 10
          done
          if [[ "$found" != true ]]; then
            echo "Desktop release $RELEASE_TAG was not published" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/CYBREX-Minecraft-Companion-26.2.jar \
            release-assets/CYBREX-Minecraft-Companion-26.2.jar.sha256 \
            release-assets/CYBREX-FiveM-Companion.zip \
            release-assets/CYBREX-FiveM-Companion.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
