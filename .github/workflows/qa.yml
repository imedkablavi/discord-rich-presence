name: QA

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install QA dependencies
        run: python -m pip install "pypresence==4.6.2" "PyYAML>=6.0.3,<7" "psutil>=7.2.2,<8" "pytest>=9.1.1,<10" "ruff>=0.9,<1"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Ruff critical checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Run tests
        run: pytest -q

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Manifest V3 JSON
        run: |
          python -m json.tool browser_extension/manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('browser_extension/manifest.json').read_text(encoding='utf-8'))
          assert manifest['manifest_version'] == 3
          assert manifest['background']['service_worker'] == 'background.js'
          assert 'background.js' in manifest['background']['scripts']
          assert 'http://127.0.0.1:32191/*' in manifest['host_permissions']
          assert '<all_urls>' in manifest['host_permissions']
          assert manifest['content_scripts'][0]['all_frames'] is False
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check browser_extension/background.js
          node --check browser_extension/content.js
      - name: Package companion extension
        run: |
          cd browser_extension
          zip -r ../CYBREX-Browser-Companion.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: CYBREX-Browser-Companion
          path: CYBREX-Browser-Companion.zip
          if-no-files-found: error

  shell-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Validate Bash and Zsh hooks
        run: |
          bash -n scripts/hooks/bash.sh
          zsh -n scripts/hooks/zsh.zsh

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build executable
        run: pyinstaller --clean --noconfirm discord-rich-presence.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DiscordRichPresence.exe")) {
            throw "Packaged executable was not created"
          }
          $size = (Get-Item "dist/DiscordRichPresence.exe").Length
          if ($size -lt 1000000) {
            throw "Packaged executable is unexpectedly small"
          }
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist/DiscordRichPresence.exe" `
            -ArgumentList "--dry-run", "--once" `
            -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill()
            throw "Packaged executable did not exit after a one-cycle dry run"
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable exited with code $($process.ExitCode)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: DiscordRichPresence-windows
          path: dist/DiscordRichPresence.exe
          if-no-files-found: error
