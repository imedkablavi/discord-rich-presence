name: Gamer Integrations

on:
  pull_request:
    paths:
      - "game_library.py"
      - "game_library_gui.py"
      - "game_packs.py"
      - "popular_games.py"
      - "game_packs/**"
      - "fivem_bridge.py"
      - "minecraft_bridge.py"
      - "league_client.py"
      - "squad_telemetry.py"
      - "presence.py"
      - "detectors/gaming.py"
      - "integrations/fivem/**"
      - "integrations/minecraft/**"
      - "tests/test_game_library.py"
      - "tests/test_game_packs.py"
      - "tests/test_popular_games.py"
      - "tests/test_fivem_bridge.py"
      - "tests/test_minecraft_bridge.py"
      - "tests/test_squad_telemetry.py"
      - "tests/test_game_activity_accuracy.py"
      - "tests/test_presence.py"
      - ".github/workflows/gamer-integrations.yml"
  push:
    branches: [main]
    paths:
      - "game_library.py"
      - "game_library_gui.py"
      - "game_packs.py"
      - "popular_games.py"
      - "game_packs/**"
      - "fivem_bridge.py"
      - "minecraft_bridge.py"
      - "league_client.py"
      - "squad_telemetry.py"
      - "presence.py"
      - "detectors/gaming.py"
      - "integrations/fivem/**"
      - "integrations/minecraft/**"
      - "tests/test_game_library.py"
      - "tests/test_game_packs.py"
      - "tests/test_popular_games.py"
      - "tests/test_fivem_bridge.py"
      - "tests/test_minecraft_bridge.py"
      - "tests/test_squad_telemetry.py"
      - "tests/test_game_activity_accuracy.py"
      - "tests/test_presence.py"
      - ".github/workflows/gamer-integrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Import gamer desktop modules
        run: |
          python -c "import customtkinter, game_library, game_library_gui, game_packs, popular_games, fivem_bridge, minecraft_bridge, league_client, squad_telemetry, presence, launcher, tray_icon"
      - name: Run gamer regression tests
        run: >-
          pytest -q
          tests/test_game_library.py
          tests/test_game_packs.py
          tests/test_popular_games.py
          tests/test_fivem_bridge.py
          tests/test_minecraft_bridge.py
          tests/test_squad_telemetry.py
          tests/test_game_activity_accuracy.py
          tests/test_presence.py
      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Validate FiveM resource
        run: |
          luac -p integrations/fivem/cybrex_presence/fxmanifest.lua
          luac -p integrations/fivem/cybrex_presence/client.lua
          luac -p integrations/fivem/cybrex_presence/server.lua
          node --check integrations/fivem/cybrex_presence/html/bridge.js
          grep -q "ui_page 'html/index.html'" integrations/fivem/cybrex_presence/fxmanifest.lua
          if grep -RIE "license:|steam:|discord:|player.*identifier|GetPlayerIdentifier|GetEntityCoords" integrations/fivem/cybrex_presence --exclude=README.md; then
            echo "Sensitive player-data primitive found in FiveM companion" >&2
            exit 1
          fi
      - name: Validate Minecraft privacy boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('integrations/minecraft/fabric-26.2/src/main/java/com/cybrex/presence/CybrexPresenceClient.java').read_text(encoding='utf-8').lower()
          forbidden = (
              'server.ip', 'getgameprofile', 'getuuid', 'position()', 'blockposition',
              'inventory', 'health', 'fooddata', 'chat', 'session', 'access_token',
          )
          hits = [item for item in forbidden if item in source]
          assert not hits, f'Forbidden Minecraft data primitive(s): {hits}'
          assert 'send_server_name", "false"' in source
          assert '127.0.0.1' in source
          PY
