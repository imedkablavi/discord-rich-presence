name: Release Policy

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-gamer-companions.yml"
      - ".github/workflows/release-policy.yml"
      - "scripts/sign-windows.ps1"
      - "scripts/write-version.py"
      - "tests/test_release_policy.py"
      - "tests/test_release_version.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-gamer-companions.yml"
      - ".github/workflows/release-policy.yml"
      - "scripts/sign-windows.ps1"
      - "scripts/write-version.py"
      - "tests/test_release_policy.py"
      - "tests/test_release_version.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install policy-test dependencies
        run: python -m pip install "pytest>=9.1.1,<10" "PyYAML>=6.0.3,<7"
      - name: Parse release workflow YAML
        shell: pwsh
        run: |
          python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('.github/workflows/release.yml').read_text(encoding='utf-8')); yaml.safe_load(pathlib.Path('.github/workflows/release-gamer-companions.yml').read_text(encoding='utf-8'))"
      - name: Parse Authenticode signing script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/sign-windows.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell signing script has syntax errors"
          }
      - name: Run release-policy regression tests
        run: python -m pytest -q tests/test_release_policy.py tests/test_release_version.py
