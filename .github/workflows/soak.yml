name: Soak

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Soak duration per OS"
        required: true
        default: "900"
  schedule:
    - cron: "23 3 * * 1"

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run resource soak
        env:
          REQUESTED_DURATION: ${{ inputs.duration_seconds }}
        run: python scripts/soak_test.py --duration ${{ inputs.duration_seconds || '900' }} --max-rss-growth-mb 64 --max-handle-growth 12 --max-thread-growth 4
