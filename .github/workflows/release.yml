name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release audit tooling
        run: python -m pip install "pip-audit>=2.9,<3" "bandit>=1.8,<2"
      - name: Audit runtime and build dependencies
        run: pip-audit -r requirements-dev.txt
      - name: Scan Python for high-severity security issues
        if: runner.os == 'Linux' && always()
        run: bandit -q -r . -x ./tests,./build,./dist -lll

  windows:
    needs: security-audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Import desktop entry points
        run: python -c "import customtkinter, gui_modern, launcher, tray_icon"
      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm discord-rich-presence.spec
      - name: Detect Windows signing configuration
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Sign Windows executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is configured but WINDOWS_SIGNING_PFX_PASSWORD is empty"
          }
          $certPath = Join-Path $env:RUNNER_TEMP "cybrex-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certPath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
          )
          try {
            $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
              -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signtool) {
              throw "signtool.exe was not found on the GitHub runner"
            }
            & $signtool.FullName sign `
              /fd SHA256 `
              /f $certPath `
              /p $env:WINDOWS_SIGNING_PFX_PASSWORD `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              "dist/DiscordRichPresence.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
            $signature = Get-AuthenticodeSignature "dist/DiscordRichPresence.exe"
            if ($signature.Status -ne 'Valid') {
              throw "Windows signature verification failed: $($signature.Status)"
            }
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_SIGNING_PFX_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_SIGNING_PFX_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Note unsigned Windows build
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: Write-Warning "No Windows signing certificate configured; release EXE will be unsigned."
      - name: Verify and smoke-test executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DiscordRichPresence.exe")) {
            throw "Packaged executable was not created"
          }
          $size = (Get-Item "dist/DiscordRichPresence.exe").Length
          if ($size -lt 1000000) {
            throw "Packaged executable is unexpectedly small"
          }
          $process = Start-Process `
            -FilePath "dist/DiscordRichPresence.exe" `
            -ArgumentList "--dry-run", "--once" `
            -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill()
            throw "Packaged executable did not exit after a one-cycle dry run"
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable exited with code $($process.ExitCode)"
          }
      - name: Validate and package Browser Companion
        shell: pwsh
        run: |
          python -m json.tool browser_extension/manifest.json | Out-Null
          node --check browser_extension/background.js
          node --check browser_extension/content.js
          node --check browser_extension/options.js
          $stage = Join-Path $env:RUNNER_TEMP "CYBREX-Browser-Companion"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($file in @(
            "manifest.json",
            "background.js",
            "content.js",
            "options.html",
            "options.js",
            "README.md"
          )) {
            Copy-Item "browser_extension/$file" $stage
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/CYBREX-Browser-Companion.zip" -Force
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          foreach ($file in @(
            "dist/DiscordRichPresence.exe",
            "dist/CYBREX-Browser-Companion.zip"
          )) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $file -Leaf
            "$hash  $name" | Set-Content -Encoding ascii "$file.sha256"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-and-extension
          path: |
            dist/DiscordRichPresence.exe
            dist/DiscordRichPresence.exe.sha256
            dist/CYBREX-Browser-Companion.zip
            dist/CYBREX-Browser-Companion.zip.sha256
          if-no-files-found: error

  linux:
    needs: security-audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Import desktop entry points
        run: python -c "import customtkinter, gui_modern, launcher, tray_icon"
      - name: Build Linux executable
        run: pyinstaller --clean --noconfirm discord-rich-presence.spec
      - name: Verify and smoke-test executable
        run: |
          test -x dist/DiscordRichPresence
          test "$(stat -c %s dist/DiscordRichPresence)" -gt 1000000
          timeout 20s ./dist/DiscordRichPresence --dry-run --once
      - name: Rename and checksum Linux executable
        run: |
          mv dist/DiscordRichPresence dist/CYBREX-DiscordRichPresence-linux-x86_64
          cd dist
          sha256sum CYBREX-DiscordRichPresence-linux-x86_64 > CYBREX-DiscordRichPresence-linux-x86_64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/CYBREX-DiscordRichPresence-linux-x86_64
            dist/CYBREX-DiscordRichPresence-linux-x86_64.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-windows-and-extension
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: release-linux
          path: release-assets
      - name: Verify release checksums before publishing
        run: |
          cd release-assets
          sha256sum -c DiscordRichPresence.exe.sha256
          sha256sum -c CYBREX-Browser-Companion.zip.sha256
          sha256sum -c CYBREX-DiscordRichPresence-linux-x86_64.sha256
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/DiscordRichPresence.exe \
            release-assets/DiscordRichPresence.exe.sha256 \
            release-assets/CYBREX-Browser-Companion.zip \
            release-assets/CYBREX-Browser-Companion.zip.sha256 \
            release-assets/CYBREX-DiscordRichPresence-linux-x86_64 \
            release-assets/CYBREX-DiscordRichPresence-linux-x86_64.sha256 \
            --generate-notes \
            --title "Discord Rich Presence ${{ github.ref_name }}"
