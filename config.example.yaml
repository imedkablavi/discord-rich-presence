# Discord Rich Presence Service Configuration
# Windows: %APPDATA%\discord-rich-presence\config.yaml
# Linux: ~/.config/discord-rich-presence/config.yaml

discord:
  # Discord Developer Application ID (numeric)
  client_id: "1437867564762923028"
  # Optional buttons: maximum 2, label 1-32 chars, URL max 512 chars.
  buttons: []

privacy:
  # off: no activity redaction
  # balanced: redact configured secrets and reduce path exposure
  # strict: generic descriptions only; browser URLs/buttons are removed
  mode: balanced
  redactions:
    - regex: '(?i)(password|token|secret|key|api[_-]?key)\S*'
    - regex: '([A-Fa-f0-9]{32,})'
  hide_home_paths: true

# Valid range: 1-3600 seconds
update_interval_secs: 5

system:
  start_minimized: false
  auto_start: false

browser_companion:
  # Optional local browser-extension bridge. It binds only to 127.0.0.1 and
  # requires a random per-user bearer token stored next to the config file.
  enabled: false
  port: 17653
  # Ignore extension state after this many seconds.
  ttl_secs: 15
  # Titles can reveal sensitive content. Disable if only service/origin is needed.
  allow_titles: true
  # Default URL policy exposes only scheme + host, never path/query/fragment.
  allow_origin: true
  # Explicit opt-in. Even when true, URL fragments are removed and private tabs
  # are always stripped of title/service/URL before they reach the detector.
  allow_exact_url: false

updates:
  # Updates remain disabled until an Ed25519 public key is configured. Tagged
  # releases must be signed by the matching private key in GitHub Actions.
  enabled: false
  auto_install: false
  manifest_url: "https://github.com/imedkablavi/discord-rich-presence/releases/latest/download/update-manifest.json"
  # Base64-encoded 32-byte Ed25519 public key. Never put the private key here.
  public_key: ""

images:
  browser: "browser"
  video: "video"
  terminal: "terminal"
  code: "code"
  app: "app"
  apps:
    explorer: "explorer"
    chrome: "chrome"
    msedge: "edge"
    edge: "edge"
    firefox: "firefox"
    brave: "brave"
    opera: "opera"
    vivaldi: "vivaldi"
    code: "vscode"
    vs code: "vscode"
    pycharm: "pycharm"
    trae: "trae"
    powershell: "powershell"
    cmd: "cmd"
  langs:
    python: "py"
    javascript: "js"
    typescript: "ts"
    cpp: "cpp"
    c: "c"
    java: "java"
    go: "go"
    rust: "rust"
    php: "php"
    ruby: "ruby"
    swift: "swift"
    kotlin: "kotlin"
    dart: "dart"
    html: "html"
    css: "css"
    json: "json"
    yaml: "yaml"
    markdown: "md"
  players:
    spotify: "spotify"
    vlc: "vlc"
    chrome: "chrome"
    edge: "edge"
    firefox: "firefox"
    mpv: "mpv"
    windows media player: "wmp"
  sites:
    youtube: "youtube"
    netflix: "netflix"
    hulu: "hulu"
    prime video: "prime"
  games:
    league of legends: "lol"
    valorant: "valorant"
    minecraft: "minecraft"
    rocket league: "rocketleague"
    fortnite: "fortnite"
    apex legends: "apex"
    grand theft auto v: "gtav"
    dota 2: "dota2"

rules:
  youtube_domains:
    - "YouTube"
    - "youtu.be"
  private_markers:
    - "Incognito"
    - "Private Browsing"
    - "InPrivate"
  enabled_detectors:
    media: true
    terminal: true
    coding: true
    browser: true
    gaming: true
    # Set false to avoid publishing generic/unknown application window titles.
    application: true
  # Clear existing Presence when a known OS/compositor lock screen is foreground.
  clear_on_lock_screen: true
  # Ignore terminal hook cache entries older than this. 0 disables expiration.
  # Valid range: 0-604800 (7 days).
  terminal_command_ttl_secs: 21600
  whitelist:
    apps: []
    sites: []
    games: []
  blacklist:
    apps: []
    sites: []
    games: []

override:
  enabled: false
  details: ""
  state: ""
  use_start_timestamp: false
  large_image_key: ""
  large_text: ""
  small_image_key: ""
  small_text: ""
  details_url: ""
  state_url: ""
  large_url: ""
  small_url: ""
  party_id: ""
  party_current: 0
  party_max: 0
  buttons: []
