# Discord Rich Presence Service Configuration
# Windows: %APPDATA%\discord-rich-presence\config.yaml
# Linux: ~/.config/discord-rich-presence/config.yaml

discord:
  # Normal users do not need a Discord Developer Portal application. The app
  # ships with the CYBREX Discord Application ID and connects to the running
  # Discord Desktop client automatically.
  # Advanced only: set a custom Application ID if you intentionally maintain
  # your own Discord application/assets. Leave empty for the built-in identity.
  application_id_override: ""
  buttons: []

privacy:
  mode: balanced
  # Exact Companion URLs in Balanced mode: none, domain, path, or full.
  # domain is the default and shares only e.g. https://www.youtube.com.
  browser_url_mode: domain
  redactions:
    - regex: '(?i)(password|token|secret|key|api[_-]?key)\S*'
    - regex: '([A-Fa-f0-9]{32,})'
  hide_home_paths: true

update_interval_secs: 2

system:
  start_minimized: false
  auto_start: false

browser_companion:
  # Optional Chromium/Firefox extension bridge. It listens on loopback only.
  enabled: true
  port: 32191
  ttl_secs: 15
  # Free declarative support for self-hosted/custom domains. Exact hostnames and
  # leading *. wildcards are accepted; no custom JavaScript is required.
  domain_services: {}
  # Example:
  # domain_services:
  #   media.home.example: "Jellyfin"
  #   "*.corp.example": "Company Portal"

images:
  use_external_app_icons: true
  icon_overrides: {}
  # Example:
  # icon_overrides:
  #   trae: "https://example.com/trae.png"
  #   konsole: "my-konsole-asset"
  browser: "browser"
  video: "video"
  terminal: "terminal"
  code: "code"
  app: "app"
  apps:
    explorer: "explorer"
    chrome: "chrome"
    msedge: "edge"
    edge: "edge"
    firefox: "firefox"
    brave: "brave"
    opera: "opera"
    vivaldi: "vivaldi"
    code: "vscode"
    vs code: "vscode"
    pycharm: "pycharm"
    trae: "trae"
    powershell: "powershell"
    cmd: "cmd"
  langs:
    python: "py"
    javascript: "js"
    typescript: "ts"
    cpp: "cpp"
    c: "c"
    java: "java"
    go: "go"
    rust: "rust"
    php: "php"
    ruby: "ruby"
    swift: "swift"
    kotlin: "kotlin"
    dart: "dart"
    html: "html"
    css: "css"
    json: "json"
    yaml: "yaml"
    markdown: "md"
  players:
    spotify: "spotify"
    vlc: "vlc"
    chrome: "chrome"
    edge: "edge"
    firefox: "firefox"
    mpv: "mpv"
    windows media player: "wmp"
  sites:
    youtube: "youtube"
    netflix: "netflix"
    hulu: "hulu"
    prime video: "prime"
  games:
    league of legends: "lol"
    valorant: "valorant"
    minecraft: "minecraft"
    rocket league: "rocketleague"
    fortnite: "fortnite"
    apex legends: "apex"
    grand theft auto v: "gtav"
    dota 2: "dota2"

rules:
  youtube_domains:
    - "YouTube"
    - "youtu.be"
  private_markers:
    - "Incognito"
    - "Private Browsing"
    - "InPrivate"
  enabled_detectors:
    media: true
    terminal: true
    coding: true
    browser: true
    gaming: true
    application: true
  activity_priority:
    # smart: foreground work beats background media, but foreground media wins.
    # foreground_first: always favor foreground terminal/code/browser over media.
    # media_first: preserve the old background-media-first behavior.
    # custom: use custom_order below.
    policy: smart
    custom_order:
      - gaming
      - terminal
      - coding
      - browser
      - media
      - application
  clear_on_lock_screen: true
  # Raw shell commands can contain arguments, so the default cache lifetime is short.
  terminal_command_ttl_secs: 900
  whitelist:
    apps: []
    sites: []
    games: []
  blacklist:
    apps: []
    sites: []
    games: []

override:
  enabled: false
  details: ""
  state: ""
  use_start_timestamp: false
  large_image_key: ""
  large_text: ""
  small_image_key: ""
  small_text: ""
  details_url: ""
  state_url: ""
  large_url: ""
  small_url: ""
  party_id: ""
  party_current: 0
  party_max: 0
  buttons: []
